{{- if or (eq .Values.multitenant.enable false) (eq .Values.azureOperatorMode "webhooks") }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/azureserviceoperator-serving-cert
  name: azureserviceoperator-cognitiveservices-vwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-cognitiveservices-azure-com-v1api20250601-account
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20250601.accounts.cognitiveservices.azure.com
  rules:
  - apiGroups:
    - cognitiveservices.azure.com
    apiVersions:
    - v1api20250601
    operations:
    - CREATE
    - UPDATE
    resources:
    - accounts
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-cognitiveservices-azure-com-v1api20250601-deployment
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20250601.deployments.cognitiveservices.azure.com
  rules:
  - apiGroups:
    - cognitiveservices.azure.com
    apiVersions:
    - v1api20250601
    operations:
    - CREATE
    - UPDATE
    resources:
    - deployments
  sideEffects: None
{{- end }}
