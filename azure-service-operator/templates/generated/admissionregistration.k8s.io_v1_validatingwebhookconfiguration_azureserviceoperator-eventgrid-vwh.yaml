{{- if or (eq .Values.multitenant.enable false) (eq .Values.azureOperatorMode "webhooks") }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/azureserviceoperator-serving-cert
  name: azureserviceoperator-eventgrid-vwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-eventgrid-azure-com-v1api20200601-domain
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20200601.domains.eventgrid.azure.com
  rules:
  - apiGroups:
    - eventgrid.azure.com
    apiVersions:
    - v1api20200601
    operations:
    - CREATE
    - UPDATE
    resources:
    - domains
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-eventgrid-azure-com-v1api20200601-domainstopic
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20200601.domainstopics.eventgrid.azure.com
  rules:
  - apiGroups:
    - eventgrid.azure.com
    apiVersions:
    - v1api20200601
    operations:
    - CREATE
    - UPDATE
    resources:
    - domainstopics
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-eventgrid-azure-com-v1api20200601-eventsubscription
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20200601.eventsubscriptions.eventgrid.azure.com
  rules:
  - apiGroups:
    - eventgrid.azure.com
    apiVersions:
    - v1api20200601
    operations:
    - CREATE
    - UPDATE
    resources:
    - eventsubscriptions
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-eventgrid-azure-com-v1api20200601-topic
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20200601.topics.eventgrid.azure.com
  rules:
  - apiGroups:
    - eventgrid.azure.com
    apiVersions:
    - v1api20200601
    operations:
    - CREATE
    - UPDATE
    resources:
    - topics
  sideEffects: None
{{- end }}
