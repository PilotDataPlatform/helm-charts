{{- if or (eq .Values.multitenant.enable false) (eq .Values.azureOperatorMode "webhooks") }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/azureserviceoperator-serving-cert
  name: azureserviceoperator-redhatopenshift-mwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-redhatopenshift-azure-com-v1api20231122-openshiftcluster
  failurePolicy: Fail
  matchPolicy: Exact
  name: default.v1api20231122.openshiftclusters.redhatopenshift.azure.com
  rules:
  - apiGroups:
    - redhatopenshift.azure.com
    apiVersions:
    - v1api20231122
    operations:
    - CREATE
    - UPDATE
    resources:
    - openshiftclusters
  sideEffects: None
{{- end }}
